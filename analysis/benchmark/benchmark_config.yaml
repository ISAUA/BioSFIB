    misar_pca25_internal_spatial_boxplot:
      type: boxplot                        # 图类型；横向箱线图矩阵。
      output_dir: results/benchmark_figures/boxplots # 本图输出目录；与外部指标箱线图分开存储。
      dataset: misar                       # 从 CSV 筛选的数据集名称。
      evaluation_id: pca25_truth_k         # MISAR PCA-25 主实验条件。
      evaluation_role: primary              # 主实验角色。
      metric_groups: [internal, spatial]   # 同时读取内部指标与空间指标；用于 silhouette 和 Moran's I 的组合图。
      metrics: [silhouette, cluster_morans_i] # 两个箱线图面板从左到右的显示顺序。
      expected_n_slices: 8                 # 每个方法×指标预期包含的 MISAR 切片数。
      slice_sort: misar_development        # 切片排序策略；保留发育时期/section 顺序的配置语义。
      output_stem: misar_pca25_internal_spatial_boxplot # 输出文件名主干；自动生成 .pdf。
      figure_size: [5.2, 3.35]             # 两个指标面板的宽和高，单位英寸。
      font_size: 8.5                       # 基础字体大小，单位 pt。
      box_width: 0.48                      # 箱体垂直方向的宽度。
      box_alpha: 0.86                      # 箱体填充透明度；范围 0–1。
      axis:
        mode: per_metric                   # 每个指标独立使用横轴范围，避免量纲差异掩盖分布。
        padding: 0.025                     # 横轴在最小/最大数据值外增加的最小留白。
        round_step: 0.05                   # 横轴边界与刻度取整步长。
