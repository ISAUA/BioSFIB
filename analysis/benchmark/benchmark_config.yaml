      output_dir: results/benchmark_figures/boxplots # 本图 PDF 输出目录。
      dataset: mouse_brain_p22             # 从合并指标 CSV 中筛选 P22 数据集。
      slices: [mouse_brain_ATAC, mouse_brain_H3K27ac, mouse_brain_H3K27me3, mouse_brain_H3K4me3] # 纳入 P22 的四张切片。
      evaluation_id: pca25_truth_k         # 七个 PCA 模型读取 PCA-25 主实验结果；SeuratWNN 由全局覆盖规则读取原生二维结果。
      evaluation_role: primary             # PCA-25 结果在 benchmark 中对应的主实验角色。
      metric_groups: [internal, spatial]   # 同时读取内部指标与空间指标两组结果。
      metrics: [silhouette, cluster_morans_i] # 两个面板从左到右依次显示 Silhouette 与 Moran's I。
      expected_n_slices: 4                 # 每个模型和每项指标必须完整包含四张 P22 切片。
      slice_sort: lexical                  # 切片按名称排序；箱线图统计不依赖显示顺序。
      output_stem: p22_pca25_internal_spatial_boxplot # 输出 PDF 文件名主干。
      figure_size: [5.2, 4.2]              # 图像宽和高，单位英寸；为八个模型保留足够纵向空间。
      font_size: 8.5                       # 图中基础字体大小，单位 pt。
      box_width: 0.48                      # 每个横向箱体的垂直宽度。
      box_alpha: 0.86                      # 箱体填充透明度；范围为 0–1。
      axis:
        mode: per_metric                   # 两个指标分别根据自身数据范围设置横轴。
        padding: 0.025                     # 横轴在观测最小值和最大值之外增加的最小留白。
        round_step: 0.05                   # 横轴上下限按 0.05 向外取整。
        min_width: 0.20                    # 每个指标横轴至少保留 0.20 的显示跨度。
      style:
        panel_background_1: '#FFFFFF'      # Silhouette 面板背景色。
        panel_background_2: '#F4F4F4'      # Moran's I 面板背景色。
        box_edge_color: '#4A4A4A'          # 箱体、须和端帽的边框颜色。
        median_color: '#222222'            # 箱体中位数线颜色。
        grid_color: '#DEDEDE'              # 横轴参考网格线颜色。

    p22_pca25_supplementary_internal_boxplot:
      type: boxplot # 图类型；横向箱线图矩阵。
      input_csv: results/benchmark_results_supplementary/p22_pca25/metrics_comparison.csv # 新增指标与原 benchmark 的完整对照长表。
      output_dir: results/benchmark_figures/boxplots/p22_supplementary # 补充指标图的独立目录；只输出 PDF。
      dataset: mouse_brain_p22 # 数据集名称。
      slices: [mouse_brain_ATAC, mouse_brain_H3K27ac, mouse_brain_H3K27me3, mouse_brain_H3K4me3] # 统计 P22 四张切片。
      evaluation_id: pca25_truth_k # 七个标准模型使用 PCA-25；WNN 自动按共享规则读取原生二维结果。
      evaluation_role: primary # 七个标准模型的评估角色。
      metric_group: internal # 只绘制内部几何指标。
      metrics: [silhouette, calinski_harabasz, davies_bouldin] # 三个面板的指标顺序。
      metric_labels: # 指标标题；箭头表示更好的方向。
        silhouette: Silhouette ↑ # 轮廓系数越高越好。
        calinski_harabasz: CH ↑ (log scale) # CH 越高越好，使用对数横轴显示大数值跨度。
        davies_bouldin: DBI ↓ # DBI 越低越好。
      expected_n_slices: 4 # 每个模型每项指标必须完整含四张切片。
      output_stem: p22_pca25_supplementary_internal_boxplot # PDF 文件名主干。
      figure_size: [7.5, 4.94] # 图像宽高，单位英寸。
      left_margin: 0.145 # 左侧模型名称占用的画布比例。
      panel_spacing: 0.18 # 相邻指标面板的水平间距。
      show_points: true # 在箱体上显示四张切片的原始数值，方便查看小样本分布。
      point_size: 10 # 原始数据点面积，单位 pt²。
      axis: # 各指标独立缩放，避免把 CH/DBI 截断在 0–1。
        mode: per_metric # 每项指标独立计算范围。
        padding: 0.025 # 线性横轴的最小留白。
        round_step: 0.05 # 线性横轴的取整步长。
        min_width: 0.20 # 线性横轴的最小跨度。
        by_metric: # 按指标覆盖横轴设置。
          calinski_harabasz: # CH 数值远大于 1，采用对数显示。
            scale: log # 横轴使用 log10 缩放，绘图值仍是原始 CH。
            log_padding_factor: 1.3 # 最小值除以、最大值乘以该比例作为留白。
            tick_format: '%.0f' # 对数轴刻度直接显示整数数值。
          davies_bouldin: # DBI 可以大于 1。
            bounds: [0, null] # 只限制下界为 0，上界随实际数据变化。
            round_step: 0.25 # DBI 横轴上下限按 0.25 取整。

    p22_pca25_supplementary_spatial_boxplot:
      type: boxplot # 图类型；横向箱线图矩阵。
      input_csv: results/benchmark_results_supplementary/p22_pca25/metrics_comparison.csv # 新增指标与原 benchmark 的完整对照长表。
      output_dir: results/benchmark_figures/boxplots/p22_supplementary # 补充指标图的独立目录；只输出 PDF。
      dataset: mouse_brain_p22 # 数据集名称。
      slices: [mouse_brain_ATAC, mouse_brain_H3K27ac, mouse_brain_H3K27me3, mouse_brain_H3K4me3] # 统计 P22 四张切片。
      evaluation_id: pca25_truth_k # 七个标准模型使用 PCA-25；WNN 自动按共享规则读取原生二维结果。
      evaluation_role: primary # 七个标准模型的评估角色。
      metric_group: spatial # 只绘制空间结构指标。
      metrics: [cluster_morans_i, cluster_gearys_c, PAS_k6, PAS_k10, neighbor_agreement_k6, CHAOS] # 六项空间指标全部保留，便于比较和选择。
      metric_labels: # 指标标题；箭头表示更好的方向。
        cluster_morans_i: Moran's I ↑ # 空间自相关越高越好。
        cluster_gearys_c: Geary's C ↓ # 局部空间差异越低越好。
        PAS_k6: PAS-6 ↓ # 六邻居局部异常 spot 比例越低越好。
        PAS_k10: PAS-10 ↓ # 十邻居局部异常 spot 比例越低越好。
        neighbor_agreement_k6: Neighbor agreement ↑ # 六邻居同标签比例越高越好。
        CHAOS: CHAOS ↓ # 同簇空间最近邻距离越低越好。
      expected_n_slices: 4 # 每个模型每项指标必须完整含四张切片。
      output_stem: p22_pca25_supplementary_spatial_boxplot # PDF 文件名主干。
      figure_size: [12.8, 4.94] # 图像宽高，单位英寸；容纳六个可读面板。
      left_margin: 0.095 # 左侧模型名称占用的画布比例。
      panel_spacing: 0.18 # 相邻指标面板的水平间距。
      show_points: true # 在箱体上显示四张切片的原始数值。
      point_size: 10 # 原始数据点面积，单位 pt²。
      axis: # 空间指标按自身数值范围缩放。
        mode: per_metric # 每项指标独立计算范围。
        padding: 0.025 # 横轴的最小留白。
        round_step: 0.05 # 横轴上下限取整步长。
        min_width: 0.20 # 横轴的最小跨度。
        by_metric: # 按指标覆盖横轴设置。
          cluster_gearys_c: # Geary's C 理论上可以超过 1。
            bounds: [0, null] # 下界为 0，上界随实际数据变化。
          CHAOS: # CHAOS 数值较小，使用更精细的横轴范围。
            padding: 0.001 # CHAOS 横轴的最小留白。
            round_step: 0.005 # CHAOS 横轴上下限取整步长。
            min_width: 0.02 # CHAOS 横轴至少保留 0.02 的跨度。
            bounds: [0, null] # 不将 CHAOS 限制在 0–1。
            tick_format: '%.3f' # CHAOS 刻度保留三位小数。

    p22_pca25_moran_chaos_pas10_boxplot:
      type: boxplot # 图类型；横向箱线图矩阵。
      input_csv: results/benchmark_results_supplementary/p22_pca25/metrics_comparison.csv # 读取已有指标，不重新聚类。
      output_dir: results/benchmark_figures/boxplots/p22_supplementary # 三项空间指标的 PDF 保存目录。
      dataset: mouse_brain_p22 # 要比较的数据集。
      slices: [mouse_brain_ATAC, mouse_brain_H3K27ac, mouse_brain_H3K27me3, mouse_brain_H3K4me3] # 汇总 P22 的四张切片。
      evaluation_id: pca25_truth_k # 标准模型使用 PCA-25；WNN 沿用共享配置中的自身二维结果。
      evaluation_role: primary # 标准模型的评估角色。
      metric_group: spatial # 仅选择空间一致性指标。
      metrics: [cluster_morans_i, CHAOS, PAS_k10] # 从左到右的指标顺序。
      metric_labels: # 各面板标题，不显示方向箭头。
        cluster_morans_i: Moran's I # 空间自相关越高越好。
        CHAOS: CHAOS # 同簇最近邻空间距离越低越好。
        PAS_k10: PAS-10 # 十邻居局部异常 spot 比例越低越好。
      expected_n_slices: 4 # 每个模型每项指标必须含四张切片。
      output_stem: p22_pca25_moran_chaos_pas10_boxplot # 新 PDF 的文件名，不覆盖六项指标的探索图。
      figure_size: [7.5, 4.94] # 画布宽高，单位英寸。
      left_margin: 0.145 # 左侧模型名称的画布留白比例。
      panel_spacing: 0.18 # 三个指标面板之间的水平间距。
      show_points: false # 不叠加原始数据点，保持与之前箱线图相同的样式。
      point_size: 10 # 数据点面积，单位 pt²。
      axis: # 按指标的数值范围独立设置横轴。
        mode: per_metric # 每项指标单独缩放，不统一数值范围。
        padding: 0.025 # 默认横轴最小留白。
        round_step: 0.05 # 默认横轴边界的取整步长。
        min_width: 0.20 # 默认横轴最小跨度。
        by_metric: # 指定指标的横轴覆盖配置。
          CHAOS: # CHAOS 数值较小，需要更精细的刻度。
            padding: 0.001 # CHAOS 横轴最小留白。
            round_step: 0.005 # CHAOS 横轴边界的取整步长。
            min_width: 0.02 # CHAOS 横轴最小跨度。
            bounds: [0, null] # 下界不小于零，上界不固定。
            tick_format: '%.3f' # CHAOS 刻度保留三位小数。

