# ============================================================================
# 统一 benchmark 与绘图配置文件
# 发布版：所有相对输入/输出路径均以仓库根目录为基准。
# 修改参数后，评估脚本和绘图脚本会自动读取最新设置。
# ============================================================================

run:
  seed: 42                         # 全局随机种子；用于记录实验设置，当前统一设为 42。
  output_dir: results/benchmark_results_expanded # 本轮扩展 benchmark 的独立输出目录；不会覆盖旧 benchmark_results。
  overwrite: false                 # 是否默认覆盖已有 benchmark 输出；命令行 --overwrite 可临时覆盖此设置。

input:
  methods:                         # 各模型结果文件及其融合 embedding 的读取规则。
    BioSFIB:                       # 我们的方法名称；同时是统一真值与空间坐标的 canonical 来源。
      file_glob: "data/benchmark/{dataset}/BioSFIB/{slice}/*_BioSFIB_result.h5ad"  # H5AD 路径模板；{dataset}/{slice} 会自动替换。
      embedding_key: X_model       # AnnData.obsm 中的最终融合 embedding 键名。
    MultiGATE:                     # MultiGATE 基线方法。
      file_glob: "data/benchmark/{dataset}/multigate/{slice}/*_rna_multigate.h5ad" # 只读取 RNA 结果，避免 RNA/ADT/peak 成对文件被重复计分。
      embedding_key: X_model       # MultiGATE 统一融合 embedding 键名。
    SMART:                          # SMART 基线方法。
      file_glob: "data/benchmark/{dataset}/smart/{slice}/*_smart_result.h5ad"      # SMART 结果文件路径模板。
      embedding_key: X_model       # SMART 统一融合 embedding 键名。
    SpaDDM:                         # SpaDDM 基线方法。
      file_glob: "data/benchmark/{dataset}/spaddm/{slice}/*_spaddm_result.h5ad"    # SpaDDM 结果文件路径模板。
      embedding_key: X_model       # SpaDDM 统一融合 embedding 键名。
    SpatialGlue:                    # SpatialGlue 基线方法。
      file_glob: "data/benchmark/{dataset}/spatialglue/{slice}/*_spatialglue_result.h5ad" # SpatialGlue 结果文件路径模板。
      embedding_key: X_model       # SpatialGlue 统一融合 embedding 键名。
    COSMOS:                         # COSMOS 新增基线方法；P22 的目录名包含扩展参数，故使用 cosmos* 通配。
      file_glob: "data/benchmark/{dataset}/cosmos*/{slice}/*_cosmos*_result.h5ad" # COSMOS 结果文件路径模板；同时兼容普通数据集与 P22。
      embedding_key: X_model       # COSMOS 的统一融合 embedding 键名。
    MISO:                           # MISO 新增基线方法；P22 的目录名包含扩展参数，故使用 miso* 通配。
      file_glob: "data/benchmark/{dataset}/miso*/{slice}/*_miso*_result.h5ad" # MISO 结果文件路径模板；同时兼容普通数据集与 P22。
      embedding_key: X_model       # MISO 的统一融合 embedding 键名。
  required_obsm_keys: [X_model, spatial] # 每份参评 H5AD 必须在 .obsm 中包含的键。
  require_identical_obs_names: true       # 是否要求五个模型的 spot/cell ID 与顺序逐元素一致。
  require_identical_spatial_coordinates: true # 是否要求五个模型的空间坐标逐元素一致；不一致时拒绝评估。

pipeline:
  pca:
    center: true                   # PCA 是否中心化；sklearn PCA 的标准行为。
    standardize: false              # 是否逐维标准化；保持 false，与 SMART 后处理流程一致。
    strict_dimensions: true         # 若 embedding 维度小于目标 PCA 维度则直接报错，避免不同模型静默使用不同维数。
    max_components_rule: "min(requested_dim, n_obs, n_features)" # strict_dimensions=false 时才使用的 PCA 降维回退规则。
  mclust:
    model_name: EEE                # R mclust 的协方差模型名称；所有方法统一使用 EEE。
    seed: 42                       # R mclust 的随机种子；正式结果统一为 42。
  spatial_moran:
    n_neighbors: 6                 # Moran's I 空间 KNN 图的邻居数；每个切片只建立一次 canonical 图。
  metrics:
    required: [ARI, NMI, AMI, V_MEASURE, HOM, FMI, silhouette, cluster_morans_i] # 必需指标；计算错误会使该方法×切片×条件标为 failed。
    optional: []                   # 可选指标；计算错误只标为 partial_success，不使整体退出码失败。

# 条件定义：每个数据集的 runs 引用一个条件名称。
# 新增 PCA/K 实验时，可先在这里新增条件，再把该条件加到相应数据集的 runs。
conditions:
  pca20_truth_k:
    pca_dim: 20                    # PCA 输出维度；所有模型在该条件下必须一致。
    cluster_count: truth_n_classes # mclust 的 K；自动读取有效真值类别数。
    role: primary                  # 条件角色；写入 CSV，便于筛选主分析结果。
  pca25_truth_k:
    pca_dim: 25                    # PCA 输出维度；用于 MISAR/P22 的主分析。
    cluster_count: truth_n_classes # 默认 K 为真值类别数；P22 会被每切片手动 K 覆盖。
    role: primary                  # 条件角色；写入 CSV，表示主分析。
  pca20_truth_k_sensitivity:
    pca_dim: 20                    # PCA 输出维度；用于 PCA-25 主分析的敏感性比较。
    cluster_count: truth_n_classes # 默认 K 为真值类别数；P22 会被每切片手动 K 覆盖。
    role: sensitivity              # 条件角色；写入 CSV，表示敏感性分析。
  tonsil_k6_primary:
    pca_dim: 20                    # Human tonsil 的 PCA 输出维度。
    cluster_count: 6               # Human tonsil 的 mclust 目标聚类数 K=6。
    role: primary                  # 将 K=6 标为主条件。
    truth_key: reference_label     # 外部指标仍使用四类 reference_label 真值，不使用 K=6 作为真值。
  tonsil_k4_sensitivity:
    pca_dim: 20                    # Human tonsil 敏感性分析的 PCA 输出维度。
    cluster_count: 4               # Human tonsil 敏感性分析的 mclust 目标聚类数 K=4。
    role: sensitivity              # 将 K=4 标为敏感性条件。
    truth_key: reference_label     # 外部指标使用四类 reference_label 真值。
  pca20_manual_k:
    pca_dim: 20                    # 无真值 RNA+ADT 数据集的 PCA 输出维度；与既定 RNA+ADT 主分析一致。
    cluster_count: manual          # K 必须由每个切片的 cluster_count_by_slice 显式给出，禁止从预测列自动推断。
    role: primary                  # 该条件作为无真值数据集的主内部/空间指标分析。

# 数据集设置：truth_key 的查找优先级为 run > condition > dataset。
datasets:
  simulation:
    truth_key: reference_label     # simulation 统一真值列；从 BioSFIB H5AD 中读取。
    methods: [BioSFIB, MultiGATE, SMART, SpaDDM, SpatialGlue, COSMOS, MISO]      # 发布版按列出的方法重新计算；仅使用已有外部结果，不运行第三方训练。
    runs:
      - condition: pca20_truth_k  # simulation 仅运行 PCA-20、真值 K 条件。

  human_lymph:
    truth_key: reference_label     # human lymph 统一真值列；从 BioSFIB H5AD 中读取。
    methods: [BioSFIB, MultiGATE, SMART, SpaDDM, SpatialGlue, COSMOS, MISO]      # 发布版按列出的方法重新计算；仅使用已有外部结果，不运行第三方训练。
    runs:
      - condition: pca20_truth_k  # human lymph 仅运行 PCA-20、真值 K 条件。

  human_tonsil:
    truth_key: reference_label     # human tonsil 的四类参考注释列。
    methods: [BioSFIB, MultiGATE, SMART, SpaDDM, SpatialGlue, COSMOS, MISO]      # 发布版按列出的方法重新计算；仅使用已有外部结果，不运行第三方训练。
    runs:
      - condition: tonsil_k6_primary     # K=6 主条件。
      - condition: tonsil_k4_sensitivity # K=4 敏感性条件。

  misar:
    truth_key: reference_label     # MISAR 统一真值列；s1/s2 的原始标签已在导出时统一到此列。
    methods: [BioSFIB, MultiGATE, SMART, SpaDDM, SpatialGlue, COSMOS, MISO]      # 发布版按列出的方法重新计算；仅使用已有外部结果，不运行第三方训练。
    runs:
      - condition: pca25_truth_k             # MISAR PCA-25 主条件。
      - condition: pca20_truth_k_sensitivity # MISAR PCA-20 敏感性条件。

  mouse_brain_p22:
    truth_key: reference_label     # P22 可用时的统一真值列；两个无真值切片会自动得到 not_applicable 外部指标。
    methods: [BioSFIB, MultiGATE, SMART, SpaDDM, SpatialGlue, COSMOS, MISO]      # 发布版按列出的方法重新计算；仅使用已有外部结果，不运行第三方训练。
    runs:
      - condition: pca25_truth_k  # P22 PCA-25 主条件。
        cluster_count_by_slice:    # 覆盖默认真值 K；按切片指定论文设定的 mclust 聚类数。
          mouse_brain_ATAC: 18     # ATAC 切片的手动 K。
          mouse_brain_H3K27ac: 16 # H3K27ac 切片的手动 K。
          mouse_brain_H3K27me3: 18 # H3K27me3 切片的手动 K。
          mouse_brain_H3K4me3: 18 # H3K4me3 切片的手动 K。
      - condition: pca20_truth_k_sensitivity # P22 PCA-20 敏感性条件。
        cluster_count_by_slice:    # PCA-20 条件下保持与主条件相同的 K，确保只比较 PCA 维数差异。
          mouse_brain_ATAC: 18     # ATAC 切片的手动 K。
          mouse_brain_H3K27ac: 16 # H3K27ac 切片的手动 K。
          mouse_brain_H3K27me3: 18 # H3K27me3 切片的手动 K。
          mouse_brain_H3K4me3: 18 # H3K4me3 切片的手动 K。

  mouse_spleen:
    truth_key: null                # 当前文件没有独立真值；official_cluster 与 BioSFIB 聚类相同，不能作为外部指标真值。
    methods: [BioSFIB, SMART, SpaDDM, SpatialGlue, COSMOS, MISO] # 六种可用模型；无 MultiGATE 与 Seurat WNN 输入。
    runs:
      - condition: pca20_manual_k # 无真值时仅计算 silhouette 和 Moran's I；外部指标记录 not_applicable。
        cluster_count_by_slice:
          mouse_spleen1: 5         # 预先指定的 spleen1 聚类数 K。
          mouse_spleen2: 5         # 预先指定的 spleen2 聚类数 K。

  mouse_thymus:
    truth_key: null                # 当前文件没有独立真值；official_cluster 与 BioSFIB 聚类相同，不能作为外部指标真值。
    methods: [BioSFIB, SMART, SpaDDM, SpatialGlue, COSMOS, MISO] # 六种可用模型；无 MultiGATE 与 Seurat WNN 输入。
    runs:
      - condition: pca20_manual_k # 无真值时仅计算 silhouette 和 Moran's I；外部指标记录 not_applicable。
        cluster_count_by_slice:
          mouse_thymus1: 8         # 预先指定的 thymus1 聚类数 K。
          mouse_thymus2: 8         # 预先指定的 thymus2 聚类数 K。
          mouse_thymus3: 8         # 预先指定的 thymus3 聚类数 K。
          mouse_thymus4: 8         # 预先指定的 thymus4 聚类数 K。

missing_truth:
  external_metrics: null           # 无真值时外部指标写为 not_applicable/空值，不将其视为零分。
  internal_metrics: [silhouette, cluster_morans_i] # 无真值切片仍计算的内部与空间指标。

output:
  metrics_csv: benchmark_metrics_expanded.csv # 本轮扩展 benchmark 的独立长表指标 CSV 文件名。
  manifest_json: run_manifest_expanded.json   # 本轮扩展 benchmark 的独立运行状态与参数记录文件名。
  predictions_dir: predictions       # 轻量 prediction H5AD 的子目录名称。
  prediction_h5ad:
    save: true                       # 是否保存每个方法×切片×条件的 prediction H5AD。
    obs_keys: [reference_label, mclust_benchmark] # prediction H5AD 中保留的 .obs 列。
    obsm_keys: [spatial, X_model_eval_pca] # prediction H5AD 中保留的 .obsm 键。
    uns_key: benchmark_metadata      # prediction H5AD 中存放运行参数的 .uns 键名。

# ============================================================================
# 绘图设置
# 使用方法：
#   python plot_benchmark_figures.py --list
#   python plot_benchmark_figures.py --figure misar_e18_5_s1_bubble
#   python plot_benchmark_figures.py --figure misar_pca25_boxplot
# 每个 definitions 条目都可复制、改名并扩展到新的数据集/切片。
# ============================================================================
figures:
  defaults:
    input_csv: source_data/benchmark/benchmark_metrics_combined.csv # 绘图读取合并后的长表 benchmark CSV 路径；包含历史、COSMOS/MISO 与 Seurat WNN 指标。
    output_dir: results/benchmark_figures   # PDF 图像输出目录。
    formats: [pdf]                  # 允许的输出格式；全局仅输出 PDF，不输出 SVG 或 PNG。
    dpi: 600                        # PDF 中未来若嵌入 raster 图像时使用的 DPI；矢量元素本身不受 DPI 限制。
    method_order: [BioSFIB, SMART, SpaDDM, MultiGATE, SpatialGlue, COSMOS, MISO, SeuratWNN] # 指标图固定模型顺序；SeuratWNN 为原生二维敏感性结果。
    highlight_method: BioSFIB       # 始终用粗体突出本模型；不再依赖模型是否排在第一行。
    method_evaluation_overrides:
      SeuratWNN:
        evaluation_id_by_dataset:
          simulation: native_2d_truth_k # simulation 的 Seurat WNN 原生二维评估条件。
          human_lymph: native_2d_truth_k # human lymph 的 Seurat WNN 原生二维评估条件。
          human_tonsil: native_2d_k6_primary # tonsil K=6 图对应的 Seurat WNN 原生二维评估条件。
          misar: native_2d_truth_k # MISAR 的 Seurat WNN 原生二维评估条件。
          mouse_brain_p22: native_2d_manual_k # P22 的 Seurat WNN 原生二维手动 K 条件。
        evaluation_role: native_sensitivity # Seurat WNN 原生二维结果的统一角色；与主 PCA benchmark 区分。
    metric_labels:                  # CSV 指标名到图中列标题的映射。
      ARI: ARI                       # Adjusted Rand Index 的显示名称。
      FMI: FMI                       # Fowlkes-Mallows Index 的显示名称。
      NMI: NMI                       # Normalized Mutual Information 的显示名称。
      AMI: AMI                       # Adjusted Mutual Information 的显示名称。
      V_MEASURE: V-Measure           # V-measure 的显示名称。
      HOM: Homo                      # Homogeneity 的简写显示名称。
      silhouette: Silhouette          # Silhouette 指标的显示名称。
      cluster_morans_i: Moran's I    # 聚类标签 Moran's I 的显示名称。
    method_colors:                   # 箱线图的模型颜色；新增模型时需在此添加颜色。
      BioSFIB: '#00A896'             # BioSFIB 的明亮青绿色。
      SMART: '#F4B400'               # SMART 的亮金黄色。
      SpaDDM: '#F15A24'              # SpaDDM 的高饱和橙红色。
      MultiGATE: '#2F80ED'           # MultiGATE 的亮蓝色。
      SpatialGlue: '#A64DDB'         # SpatialGlue 的明亮紫色。
      COSMOS: '#E83E8C'              # COSMOS 的亮玫红色；与既有蓝绿橙紫明显区分。
      MISO: '#00A6D6'                # MISO 的亮青蓝色；与 BioSFIB 青绿色保持可辨识差异。
      SeuratWNN: '#7CB342'           # Seurat WNN 的明亮黄绿色；用于原生二维敏感性行。

  spatial_umap_maps_defaults:        # spatial_umap_maps 的共享设置；新增地图只需设置数据集、切片、条件和输出名称。
    method_order: [BioSFIB, SMART, SpaDDM, MultiGATE, SpatialGlue, COSMOS, MISO, SeuratWNN] # 地图面板从左到右的模型顺序；SeuratWNN 直接使用自身二维坐标。
    prediction_dir: results/benchmark_results_expanded/predictions # prediction H5AD 根目录。
    prediction_dirs_by_method:
      COSMOS: results/benchmark_results_expanded/predictions # COSMOS prediction 的增量输出根目录。
      MISO: results/benchmark_results_expanded/predictions # MISO prediction 的增量输出根目录。
      SeuratWNN: results/benchmark_results_seurat_wnn/predictions # SeuratWNN 原生二维 prediction 的独立输出根目录；仅在该方法列入地图时使用。
    prediction_evaluation_ids_by_method:
      SeuratWNN: native_2d_truth_k # SeuratWNN 默认原生二维条件；tonsil/P22/无真值数据集可在具体图定义中覆盖。
    umap_source_keys_by_method:
      SeuratWNN: X_model_native_2d # SeuratWNN 二维嵌入图直接读取自身原生二维坐标。
    umap_precomputed_methods: [SeuratWNN] # 对列表中的方法直接绘制二维坐标，不再次计算 UMAP。
    outputs:
      spatial_dir: results/benchmark_figures/maps/spatial_composites # 六列 Spatial 合成 PDF 的输出目录。
      umap_dir: results/benchmark_figures/maps/umap_composites       # 六列 UMAP 合成 PDF 的输出目录。
      spatial_panel_dir: results/benchmark_figures/maps/spatial_panels # 单个 Spatial panel PDF 的输出目录。
      umap_panel_dir: results/benchmark_figures/maps/umap_panels       # 单个 UMAP panel PDF 的输出目录。
      mapping_dir: results/benchmark_figures/maps/color_mappings       # 预测簇到真值颜色的 JSON 映射目录。
      formats: [pdf]                 # 地图只输出 PDF，方便后期在 Illustrator 中拼版。
      save_single_panels: true        # 是否额外保存 Ground truth 与每个模型的独立 PDF panel。
      save_color_mappings: true       # 是否保存每个模型的 cluster-to-color JSON 映射。
      save_standalone_legends: true
      legend_dir: results/benchmark_figures/maps/legends
    colors:
      truth_palette: tab20            # 真值类别离散色板；当前类别数最多 18，tab20 足够。
      cluster_palette: tab20          # 不使用真值时，原始 mclust 簇编号使用的共享离散色板。
      unmatched_palette: Set3         # 预测簇多于真值类别时，未匹配簇使用的备用离散色板。
      unmatched_color: '#BDBDBD'      # 备用色板耗尽时使用的最终灰色。
    legends:
      truth: true                     # 是否显示真值标签图例；无有效真值时会自动跳过。
      clusters: false                 # 是否显示原始 mclust 簇编号图例；raw_clusters 模式可单独开启。
    truth_label_aliases_by_dataset:   # 仅替换图例显示文字；颜色匹配、真值键、指标和 H5AD 均保持原样。
      misar:                          # MISAR 的统一数字编码到真实组织名称映射；S2 复用同阶段编码体系。
        '0': Unannotated              # 编号 0 没有可靠组织注释，明确显示为未注释。
        '1': Hindbrain                # Basal_plate_of_hindbrain 的论文图简写。
        '2': Primary_brain_1          # Primary brain 区域 1。
        '3': DPallv                   # Dorsal pallium ventral region。
        '4': Cartilage_1              # Cartilage 区域 1。
        '5': Muscle                   # Muscle。
        '6': Cartilage_2              # Cartilage 区域 2。
        '7': Cartilage_3              # Cartilage 区域 3。
        '8': Mesenchyme               # Mesenchyme。
        '9': Cartilage_4              # Cartilage 区域 4。
        '10': Thalamus                # Thalamus。
        '11': DPallm                  # Dorsal pallium medial region。
        '12': Primary_brain_2         # Primary brain 区域 2。
        '13': Diencephalon            # Diencephalon_and_hindbrain 的论文图简写。
        '14': Midbrain                # Midbrain。
        '15': Subpallium_1            # Subpallium 区域 1。
        '16': Subpallium_2            # Subpallium 区域 2。
    spatial:
      point_size: 10                  # Spatial 点的散点面积；可按 spot 密度调整。
      point_alpha: 1.0                # Spatial 点透明度；范围 0–1。
      display_target_span: null       # 仅用于绘图的目标坐标跨度 [X, Y]；null 保持原坐标。非 null 时按轴独立归一化，不改 H5AD/指标。
      invert_y: false                 # 是否翻转 Spatial 的 Y 轴。
      show_axes: false                # 是否显示空间坐标轴；论文 panel 通常设为 false。
      show_frame: true                # 不显示空间坐标轴时，是否保留与 UMAP 一致的黑色外框。
      transform:
        flip_horizontal: false        # 是否先按水平方向（左右）翻转空间坐标。
        flip_vertical: false          # 是否在左右翻转后，按垂直方向（上下）翻转空间坐标。
        rotate_cw: 0                  # 水平翻转后顺时针旋转的角度；仅可为 0、90、180 或 270，UMAP 不受影响。
    umap:
      source_key: X_model_eval_pca    # 生成 UMAP 的 .obsm 键；与 benchmark 聚类使用的 PCA 表示保持一致。
      n_neighbors: 15                 # Scanpy UMAP 邻居数。
      min_dist: 0.30                  # Scanpy UMAP 最小距离。
      metric: euclidean               # 构建 UMAP 邻居图的距离度量。
      random_state: 42                # UMAP 随机种子；保证重复出图坐标一致。
      point_size: 10                  # UMAP 点的散点面积。
      point_alpha: 0.90               # UMAP 点透明度；范围 0–1。
      show_axes: true                 # 是否显示 UMAP 1/2 轴。
      ylabel_position: 0.005           # UMAP 2 轴标题的相对 X 位置；放在本 panel 左边框内侧，避免落在两图间隙而与左侧 panel 外框重叠。
      axis_label_pad: 1.0             # UMAP 1/2 轴标题与坐标轴的间距，单位 pt。
    layout:
      composite_size: [14.0, 3.10]    # 六列合成 PDF 的宽和高，单位英寸。
      single_panel_size: [2.5, 2.5]   # 单独 panel PDF 的宽和高，单位英寸。
      legend_ncol: auto               # 共享图例列数；auto 表示按类别数使用单行。
      font_size: 8                    # 基础字体大小，单位 pt。
      title_size: 9                   # 每个 panel 顶部标题字体大小，单位 pt。
      dpi: 600                         # PDF 中未来嵌入 raster 元素时使用的 DPI。
      legend_font_size: 9.0
      legend_title_size: 9.0
      legend_marker_size: 6.5
      truth_legend_ncol_by_dataset:   # 各数据集独立真值图例的默认列数；具体 figure 中的 truth_legend_ncol 优先级更高。
        misar: 4                      # MISAR 组织名称较长，默认分成 4 列，避免单行过宽。
      truth_legend_order_by_dataset:  # 各数据集独立真值图例的排列方向。
        misar: row_major              # MISAR 按行从左到右排列组织名称。
      truth_legend_size_by_dataset:   # 各数据集独立真值图例的基础画布 [宽, 高]，单位英寸。
        misar: [10.0, 3.0]            # 为 MISAR 的组织名称和多行布局预留空间。

  boxplot_defaults:                   # boxplot 的共享设置；只影响箱线图，不改变 Spatial/UMAP 的模型顺序。
    method_order: [SeuratWNN, MISO, COSMOS, SpatialGlue, MultiGATE, SpaDDM, SMART, BioSFIB] # 按当前顺序的完全反序从上到下排列，BioSFIB 位于最下方。

  bubble_matrix_defaults:             # bubble_matrix 的共享设置；新增圆点图可继承色阶和表格样式。
    method_order: [SeuratWNN, MISO, COSMOS, SpatialGlue, MultiGATE, SpaDDM, SMART, BioSFIB] # 按当前顺序的完全反序从上到下排列，BioSFIB 位于最下方。
    colorbar_tick_font_size: 8.5       # 色条数字刻度字号，单位 pt；由原来的 6.5 pt 增大 2 pt。
    colorbar_label_font_size: 9.0      # 色条“Metric value”标题字号，单位 pt；由原来的 7 pt 增大 2 pt。
    color_scale:
      mode: auto                        # 色阶范围模式；auto 按当前图所有显示数值自动计算，fixed 才使用下方 vmin/vmax。
      padding_fraction: 0.00            # auto 模式下，实际数值范围两端额外保留的比例边距；0 表示直接使用观测最高/最低值。
      minimum_padding: 0.00             # auto 模式下，两端至少保留的绝对边距；0 表示不额外扩展范围。
      minimum_span: 0.05                # auto 模式下色阶的最小总宽度，防止单一或近似数值导致颜色过度敏感。
      round_step: 0.10                  # auto 模式最终上下限向外取整的步长；0.10 表示色条只保留 0.1 的量级。
      vmin: 0.30                        # fixed 模式的色条下限；auto 模式下不使用。
      vmax: 0.70                        # fixed 模式的色条上限；auto 模式下不使用。
      cmap: BuGn                        # Matplotlib 连续色图名称。
      cmap_low: 0.08                   # 从原始色图中截取的起始位置；0–1，增大可避免过白。
      cmap_high: 0.82                  # 从原始色图中截取的终止位置；0–1，减小可避免过深。
    style:
      row_band_color: '#F1F5F2'        # 交替行背景色。
      separator_color: '#718078'       # 行间虚线颜色。
      rule_color: '#222222'            # 表格实线、分隔线颜色。
      dark_text: '#17231F'             # 浅色圆点/色块上的数字文字颜色。

  definitions:
    misar_e18_5_s1_maps:
      type: spatial_umap_maps      # 图类型；同时生成 Spatial 与 UMAP 的对称比较图。
      dataset: misar               # 读取 prediction H5AD 的数据集名称。
      slice: misar_e18-5-s1        # 读取 prediction H5AD 的切片名称。
      evaluation_id: pca25_truth_k # 读取 prediction H5AD 的 benchmark 条件名称。
      evaluation_role: primary     # 与 metrics CSV 对应的条件角色；用于图文件元数据记录。
      method_order: [BioSFIB, SMART, SpaDDM, MultiGATE, SpatialGlue, COSMOS, MISO, SeuratWNN] # 面板从左到右的模型顺序；SeuratWNN 直接使用自身二维坐标。
      prediction_dir: results/benchmark_results_expanded/predictions # prediction H5AD 根目录；其下按条件/数据集/切片/模型组织。
      output_stem: misar_e18_5_s1  # Spatial 与 UMAP 输出文件的共同名称主干。
      outputs:
        spatial_dir: results/benchmark_figures/maps/spatial_composites # 六列 Spatial 合成 PDF 的新建目录。
        umap_dir: results/benchmark_figures/maps/umap_composites       # 六列 UMAP 合成 PDF 的新建目录。
        spatial_panel_dir: results/benchmark_figures/maps/spatial_panels # 单个 Spatial panel PDF 的新建目录。
        umap_panel_dir: results/benchmark_figures/maps/umap_panels       # 单个 UMAP panel PDF 的新建目录。
        mapping_dir: results/benchmark_figures/maps/color_mappings       # 预测簇到真值颜色的 JSON 映射目录。
        formats: [pdf]                 # 地图只输出 PDF，方便后期在 Illustrator 中拼版。
        save_single_panels: true        # 是否额外保存 Ground truth 与每个模型的独立 PDF panel。
        save_color_mappings: true       # 是否保存每个模型的 cluster-to-color JSON 映射。
      colors:
        truth_palette: tab20            # 真值类别离散色板；当前类别数最多 18，tab20 足够。
        unmatched_palette: Set3         # 预测簇多于真值类别时，未匹配簇使用的备用离散色板。
        unmatched_color: '#BDBDBD'      # 备用色板耗尽时使用的最终灰色。
      spatial:
        point_size: 10                  # Spatial 点的散点面积；可按 spot 密度调整。
        point_alpha: 1.0                # Spatial 点透明度；范围 0–1。
        invert_y: false                 # 是否翻转 Spatial 的 Y 轴；不同平台/切片方向不同时可修改。
        show_axes: false                # 是否显示空间坐标轴；论文 panel 通常设为 false。
      umap:
        source_key: X_model_eval_pca    # 生成 UMAP 的 .obsm 键；与 benchmark 聚类使用的 PCA 表示保持一致。
        n_neighbors: 15                 # Scanpy UMAP 邻居数。
        min_dist: 0.30                  # Scanpy UMAP 最小距离；越小簇越紧凑。
        metric: euclidean               # 构建 UMAP 邻居图的距离度量。
        random_state: 42                # UMAP 随机种子；保证重复出图坐标一致。
        point_size: 10                  # UMAP 点的散点面积。
        point_alpha: 0.90               # UMAP 点透明度；范围 0–1。
        show_axes: true                 # 是否显示 UMAP 1/2 轴；当前与参考论文图一致，保留简洁坐标轴。
      layout:
        composite_size: [14.0, 3.10]    # 六列合成 PDF 的宽和高，单位英寸；为单行共享图例预留底部空间。
        single_panel_size: [2.5, 2.5]   # 单独 panel PDF 的宽和高，单位英寸。
        legend_ncol: auto               # 合成图共享图例的列数；auto 表示按类别数使用单行并尽量铺满宽度。
        font_size: 8                    # 基础字体大小，单位 pt。
        title_size: 9                   # 每个 panel 顶部标题字体大小，单位 pt。
        dpi: 600                         # PDF 中未来嵌入 raster 元素时使用的 DPI。

