# Descriptive reporting configuration for the MISAR developmental enrichment
# supplement. These terms were frozen after reviewing the completed enrichment
# results and are used only for the representative dot matrices. Exact Jaccard
# summaries are computed from every FDR-significant term, not from this subset.
analysis:
  title: MISAR developmental enrichment consistency
  claim: Conserved neural, adhesion, glial, and extracellular-matrix programs coexist with stage- and slice-associated enrichment from E11.0 to E18.5.
  role: supplementary_descriptive_robustness
  selection_status: post_result_reporting_selection
  selection_note: Representative terms were selected after enrichment inspection for visualization and must not be described as preregistered or used as the universe for overlap statistics.

datasets:
  - key: misar_e11_0_s1
    stage: E11.0
    stage_value: 11.0
    slice: S1
    label: E11.0 S1
    results: source_data/enrichment/misar_e11_0_s1/enrichment_significant_results.csv
    qc: source_data/enrichment/misar_e11_0_s1/enrichment_input_qc.csv
    manifest: source_data/enrichment/misar_e11_0_s1/gene_set_enrichment_manifest.json

  - key: misar_e11_0_s2
    stage: E11.0
    stage_value: 11.0
