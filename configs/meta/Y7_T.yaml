# Canonical Y7_T configuration: RNA PCA 128, spectral reconstruction 0.01.
# Fixed final epoch 1500, z_out, PCA 20 and Mclust EEE K=14.
project:
  name: BioSFIB-SSR-Y7_T
  version: 3.0.0
  seed: 42
  save_dir: results/META/Y7_T/checkpoints/
  eval_dir: results/META/Y7_T/predictions/

eval:
  checkpoint: ckpt_final.pth
  cluster_method: mclust
  # Fixed standardized readout requested for the canonical SpatialMETA Y7_T data.
  n_clusters: 14
  mclust_pca_dim: 20
  mclust_model: EEE
  moran_k: 6
  compute_gt_metrics: false
  compute_jaccard: true
  jaccard_k: 50
  jaccard_other_label: metabolome
  plotting:
    figure_dpi: 180
    figure_size: [14, 6]
    panel_size: [6, 6]
    umap_point_size: 100
    spatial_point_size: 80
    alpha: 1.0
    legend_loc: on data
    palette_mode: high_contrast
    cluster_outline:
      enable: true
      min_points: 10
      line_width: 1.5
      alpha: 0.8
      use_cluster_colors: true
      color: "#000000"
      circle_fallback: true
  fixed_embedding: z_out
  formal_epoch: 1500

data:
  raw_path: data/raw/renal/Y7_T
  processed_path: data/processed/renal/Y7_T_spatialmeta_ssr128_moran500
  files:
    rna_h5ad: adata_joint_Y7_T_raw_ST.h5ad
  parameters:
    reduce:
      mode: cpu
      device: auto
      q_offset: 8
      niter: 3
    n_top_genes: 3000
    rna_use_pca: true
    rna_pca_dim: 128
    rna_min_cells: 3
    rna_target_sum: 10000.0
    rna_apply_scale: false
    atac_pca_dim: 128
    knn_k: 9
    use_rna_similarity_edge_weight: false
    graph_edge_weight_mode: spatial_distance
    # The paper's pathological_annotation is not present in the public Y7_T files.
    ground_truth_key: null

sm_data_path: adata_joint_Y7_T_raw_SM.h5ad
sm_preprocess:
  replace_atac: true
  target_sum: 10000.0
  apply_log1p: true
  spatial_hvg_method: morans_i
  n_top_metabolites: 500
  apply_scale: false
  use_pca: false
  pval_threshold: 0.05
  drop_dead_spots: false
  spatial_graph_method: knn
  moran_k: 6
  radius: null
  moran_permutations: 0

model:
  name: BioSFINet-SSR
  output_fusion_mode: ssr
  n_freq_components: null
  rna_in_dim: 128
  sfib_dim: 128
  dropout: 0.1
  sfib_wavelet_t_low: 8.0
  sfib_wavelet_t_high: 1.5
  sfib_wavelet_mid_scale_init: 0.1
  sfib_wavelet_mid_scale_max: 0.25
  sfib_boundary_slope_init: 0.75
  sfib_modality_gate_mode: learned
  sfib_modality_gate_rho: 0.5
  sfib_spatial_residual_enabled: true

train:
  epochs: 1500
  learning_rate: 0.001
  learning_rate_low: 0.0001
  lr_switch_epoch: 1000
  weight_decay: 0.0001
  gradient_clip: 5.0
  alignment_mode: correspondence
  lambda_align: 0.1
  lambda_rec_rna: 1.0
  lambda_rec_atac: 1.0
  lambda_residual: 0.001
  lambda_spec_recon: 0.01
  reconstruction_loss_mode: feature_std
  reconstruction_std_eps: 0.0001
  reconstruction_std_floor_factor: 0.1
  device: cuda
  log_interval: 10
